[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/ui/crystal_v2/*.b64"
exclude_filter="artifacts/*,build/*,dist/*,tools/*,Docs/*,docs/*,assets/references/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}canvas{touch-action:none}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Android Debug"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/ui/crystal_v2/*.b64"
exclude_filter="artifacts/*,build/*,dist/*,tools/*,Docs/*,docs/*,assets/references/*"
export_path="build/android/ilha-do-cristal-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
package/name="A Ilha do Cristal"
package/unique_name="com.fabiofsjunior.ilhadocristal"
package/signed=true
version/code=11
version/name="0.1.10"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
launcher_icons/main_192x192="res://assets/ui/app_icon.png"
launcher_icons/adaptive_background_432x432="res://assets/ui/app_icon_background.png"
launcher_icons/adaptive_foreground_432x432="res://assets/ui/app_icon_foreground.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/ui/app_icon_monochrome.png"

screen/immersive_mode=true
screen/edge_to_edge=true

[preset.2]
name="Android Content Pack"
platform="Android"
runnable=false
dedicated_server=false
custom_features=""
export_filter="resources"
export_files=PackedStringArray()
include_filter="game/data/*.json,data/catalogs/mvp.json,assets/creatures/*/*.json,assets/environments/terrain_mvp_candidate_v1/*.json,assets/ui/pixel_hud_v1/regions.json,assets/characters/*/*/*.json,assets/characters/*/warrior/*.png,assets/characters/melissa/mage/*.png,assets/creatures/*/*.png,assets/environments/terrain_mvp_candidate_v1/*.png,assets/environments/tropical_oblique_candidate/*.png,assets/ui/classic_v2/*.png,assets/ui/pixel_hud_v1/source_sheet.png,assets/ui/crystal_v2/*.b64"
exclude_filter="*.gd,*.gdc,*.tscn,*.scn,*.tres,*.res,*.cs,*.gdshader,*.gdshaderinc,*.uid,*.md,*.py,*.bat,*.sh,*.html,artifacts/*,docs/*,Docs/*,tools/*,build/*,dist/*,assets/references/*"
export_path="build/android/ilha-do-cristal-content.pck"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]
custom_template/debug=""
custom_template/release=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true


