<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Protótipo · Atualização de conteúdo</title>
  <style>
    :root { color-scheme: dark; --bg:#101b26; --panel:#172630; --line:#428c83; --cream:#f0ead8; --muted:#a6bac0; --mint:#8de0d0; --gold:#f4c875; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 20%,#1c333d,var(--bg) 65%); color:var(--cream); font:16px/1.5 system-ui,sans-serif; }
    main { width:min(100%,440px); }
    .brand { text-align:center; margin-bottom:24px; }
    .crystal { color:var(--mint); font-size:42px; line-height:1; }
    h1 { margin:7px 0 2px; font-size:22px; letter-spacing:.08em; }
    .subtitle,.footer { color:var(--muted); font-size:13px; }
    .card { min-height:430px; padding:30px 26px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; text-align:center; border:1px solid var(--line); border-radius:18px; background:linear-gradient(160deg,#1b3039,var(--panel)); box-shadow:0 24px 70px #0006; }
    .kicker { color:var(--mint); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h2 { margin:0; font-size:28px; line-height:1.15; }
    p { margin:0; }
    .muted { color:var(--muted); font-size:14px; }
    .notes { width:100%; text-align:left; padding:14px 16px; border-radius:12px; background:#0d1b24; color:#d6e3df; font-size:14px; }
    .actions { width:100%; display:grid; gap:10px; margin-top:4px; }
    button { min-height:54px; border:1px solid #648b87; border-radius:10px; color:var(--cream); background:#263b43; font:700 16px system-ui,sans-serif; cursor:pointer; }
    button.primary { color:#10201f; border-color:var(--mint); background:var(--mint); }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    progress { width:100%; height:18px; accent-color:var(--mint); }
    .footer { margin-top:18px; text-align:center; letter-spacing:.08em; }
    .badge { padding:4px 9px; border:1px solid #4d696e; border-radius:999px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <div class="crystal" aria-hidden="true">✧</div>
      <h1>A ILHA DO CRISTAL</h1>
      <div class="subtitle">Exploração · sobrevivência · cooperação</div>
    </header>
    <section class="card" id="screen" aria-live="polite"></section>
    <div class="footer">PROTÓTIPO NAVEGÁVEL · DADOS SIMULADOS</div>
  </main>
  <script>
    const screen = document.querySelector('#screen');
    const states = {
      checking: `<span class="kicker">Inicialização</span><h2>Verificando atualizações</h2><p>Consultando as versões de conteúdo no GitHub…</p><p class="muted">A conexão é usada apenas para procurar uma versão nova.</p>`,
      available: `<span class="kicker">Atualização disponível</span><h2>Novidades na ilha</h2><span class="badge">Conteúdo 1.0.1 · 24 MB</span><div class="notes"><strong>Novidades</strong><br>• Novo trecho da ilha<br>• Ajustes de equilíbrio<br>• Correções de criaturas</div><p class="muted">O pacote é verificado antes de ser aplicado. Seu progresso fica preservado.</p><div class="actions"><button class="primary" onclick="download()">Atualizar agora</button><button onclick="show('game')">Agora não</button></div>`,
      downloading: `<span class="kicker">Baixando do GitHub</span><h2>Preparando a atualização</h2><p>Baixando o pacote de conteúdo…</p><progress id="progress" max="100" value="0"></progress><p class="muted" id="progressText">0 MB / 24 MB</p>`,
      verifying: `<span class="kicker">Verificando pacote</span><h2>Conferindo integridade</h2><p>Validando tamanho e SHA-256 antes de ativar os arquivos.</p>`,
      restarting: `<span class="kicker">Pacote verificado</span><h2>Reiniciando o jogo</h2><p>Conteúdo instalado. Recarregando a ilha…</p><p class="muted">Seu progresso salvo foi mantido.</p>`,
      game: `<span class="kicker">Tudo atualizado</span><h2>Bem-vindo à ilha</h2><p>Conteúdo 1.0.1 · sem novos arquivos para baixar.</p><p class="muted">Seus arquivos de progresso ficam separados dos pacotes de atualização.</p><div class="actions"><button class="primary" onclick="show('checking'); setTimeout(()=>show('available'),700)">Entrar no jogo</button></div>`,
      error: `<span class="kicker">Atualização indisponível</span><h2>Não foi possível atualizar</h2><p>Verifique sua conexão e tente de novo.</p><div class="actions"><button class="primary" onclick="show('checking'); setTimeout(()=>show('available'),700)">Tentar novamente</button><button onclick="show('game')">Continuar com a versão atual</button></div>`
    };
    function show(state) { screen.innerHTML = states[state]; }
    function download() {
      show('downloading'); let value = 0;
      const timer = setInterval(() => {
        value = Math.min(100, value + 10);
        const bar = document.querySelector('#progress');
        if (bar) bar.value = value;
        const text = document.querySelector('#progressText');
        if (text) text.textContent = `${(24 * value / 100).toFixed(1)} MB / 24 MB`;
        if (value === 100) {
          clearInterval(timer); show('verifying');
          setTimeout(() => { show('restarting'); setTimeout(() => show('game'), 1200); }, 700);
        }
      }, 140);
    }
    show('checking'); setTimeout(() => show('available'), 850);
  </script>
</body>
</html>
